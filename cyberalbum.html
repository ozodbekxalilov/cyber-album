<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Hozircha Nomalum</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: #0d0d0d;
      color: #00f0ff;
      overflow-x: hidden;
      text-align: center;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    h1 {
      margin-top: 40px;
      font-size: 3em;
      text-shadow: 0 0 20px #00f0ff;
    }

    .album {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      padding: 50px;
      max-width: 1200px;
      margin: auto;
    }

    .photo {
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid #00f0ff;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .photo:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
    }

    .photo img {
      width: 100%;
      height: auto;
      display: block;
      border-bottom: 1px solid #00f0ff;
    }

    .caption {
      padding: 15px;
      background-color: rgba(0, 0, 0, 0.6);
    }

    .upload-btn {
      display: inline-block;
      margin: 20px;
      padding: 10px 20px;
      background: #00f0ff;
      color: #000;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #upload {
      display: none;
    }

    #modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #modal img {
      max-width: 90%;
      max-height: 90%;
      border: 5px solid #00f0ff;
      border-radius: 10px;
    }

    footer {
      margin-top: 50px;
      font-size: 0.9em;
      opacity: 0.6;
    }

    .audio-btn {
      margin: 10px;
      padding: 10px 20px;
      background: #00f0ff;
      color: #000;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  <h1>hozircha nomalum </h1>

  <div class="album">
    <div class="photo" onclick="openModal('images/rasm1.jpg')">
      <img src="images/rasm1.jpg" alt="Developer">
      <div class="caption">Ozodbek Xalilov</div>
    </div>
    <div class="photo" onclick="openModal('images/rasm2.jpg')">
      <img src="images/rasm2.jpg" alt="abror">
      <div class="caption">nomalum</div>
    </div>
    <div class="photo" onclick="openModal('images/rasm3.jpg')">
      <img src="images/rasm3.jpg" alt="nomalum">
      <div class="caption">nomalum</div>
    </div>
  </div>

  <input type="file" id="upload" accept="image/*" onchange="addImage(event)">
  <label for="upload" class="upload-btn">📤 Rasm yuklash</label>
  <button class="audio-btn" onclick="toggleAudio()">🎵 Musiqani yoqish/o‘chirish</button>

  <div id="modal" onclick="closeModal()">
    <img id="modal-img" src="">
  </div>

  <footer>© 2025 |E-Albom</footer>

  <!-- Particle.js -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 80 },
        color: { value: "#00f0ff" },
        shape: { type: "circle" },
        opacity: { value: 0.5 },
        size: { value: 3 },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#00f0ff",
          opacity: 0.4,
          width: 1
        },
        move: {
          enable: true,
          speed: 3,
          direction: "none",
          out_mode: "bounce"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100 },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });

    function openModal(src) {
      document.getElementById("modal-img").src = src;
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    function addImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const album = document.querySelector(".album");
        const div = document.createElement("div");
        div.className = "photo";
        div.onclick = () => openModal(e.target.result);

        const img = document.createElement("img");
        img.src = e.target.result;
        img.alt = "Yangi rasm";

        const caption = document.createElement("div");
        caption.className = "caption";
        caption.textContent = "Rasm muvofaqiyatli yuklandi";

        div.appendChild(img);
        div.appendChild(caption);
        album.appendChild(div);
      };
      reader.readAsDataURL(file);
    }

    const audio = new Audio("Dissasembly Required.mp3");
    audio.loop = true;
    let playing = false;

    function toggleAudio() {
      if (playing) {
        audio.pause();
      } else {
        audio.play();
      }
      playing = !playing;
    }
  </script>
</body>
</html>
